# Install once with `make install` (runs `uvx pre-commit install`).
# Run on everything: `uvx pre-commit run --all-files`
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: check-merge-conflict
      - id: detect-private-key
        # The redaction corpus holds FAKE private keys on purpose (see .gitleaks.toml).
        exclude: ^backend/tests/fixtures/redaction/corpus\.yaml$

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.5
    hooks:
      - id: ruff-check
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  - repo: local
    hooks:
      - id: mypy
        name: mypy (backend)
        entry: bash -c 'cd backend && uv run mypy'
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false
      - id: frontend-format
        name: prettier (frontend)
        entry: bash -c 'cd frontend && npx prettier --check .'
        language: system
        files: ^frontend/
        pass_filenames: false
      - id: frontend-lint
        name: oxlint (frontend)
        entry: bash -c 'cd frontend && npm run --silent lint'
        language: system
        files: ^frontend/.*\.(ts|tsx)$
        pass_filenames: false
