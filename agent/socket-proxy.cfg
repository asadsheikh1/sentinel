# SENTINEL Agent: GET-only proxy in front of the Podman or Docker API socket.
#
# A container-engine socket gives full control of the engine (and, for rootful
# engines, of the host), even when it is mounted read-only. The agent never gets
# it. It talks to this proxy instead, which allows only the few read endpoints
# the docker_stats receiver uses and answers 403 to everything else.
#
# Environment (set by the systemd unit or the container):
#   SENTINEL_ENGINE_SOCKET  the engine socket, e.g. /run/podman/podman.sock
#   SENTINEL_PROXY_SOCKET   where to listen, e.g. /run/sentinel-agent-proxy/engine.sock

global
    log stdout format raw local0 info
    maxconn 64
    # No master/worker, no stats socket, no runtime API.

defaults
    mode http
    log global
    option httplog
    timeout connect 5s
    timeout client 30s
    timeout server 30s

frontend engine_proxy
    bind "unix@${SENTINEL_PROXY_SOCKET}" mode 660
    # The agent's only connection that may sit idle is the /events stream.
    timeout client 1h

    # 1. Read-only methods.
    http-request deny deny_status 403 unless METH_GET || METH_HEAD

    # 2. Only what docker_stats needs: API negotiation, the container list,
    #    inspect (for names and labels), one-shot stats and the event stream.
    #    Logs, exec, attach, archive, images, volumes, secrets, system info: denied.
    acl allowed_path path_reg ^(/v[0-9]+\.[0-9]+)?/(_ping|version|events|containers/json|containers/[A-Za-z0-9_.-]+/(json|stats))$
    http-request deny deny_status 403 unless allowed_path

    # 3. No streaming stats (the receiver asks for one sample at a time).
    acl stats_path path_reg /containers/[A-Za-z0-9_.-]+/stats$
    acl one_shot url_param(stream) -m str false 0
    http-request deny deny_status 403 if stats_path !one_shot

    # Allowed requests are not logged (the agent polls every few seconds, and the
    # log lines would come straight back through the journal). Denied ones are:
    # the deny rules above end processing before this line.
    http-request set-log-level silent

    acl events_path path_reg ^(/v[0-9]+\.[0-9]+)?/events$
    use_backend engine_events if events_path
    default_backend engine

backend engine
    server engine "unix@${SENTINEL_ENGINE_SOCKET}"

# /events is a long-lived stream that is idle until a container starts or stops;
# a 30 s timeout would cut it (and the agent could miss events while reconnecting).
backend engine_events
    timeout server 1h
    server engine "unix@${SENTINEL_ENGINE_SOCKET}"
