# SENTINEL telemetry stores. Used together with compose.yaml:
#   make obs-up   (= podman compose -f compose.yaml -f compose.observability.yaml up -d)
#
# Images are pinned by tag AND multi-arch digest. Ports are bound to 127.0.0.1
# for local development only; nothing here is reachable from outside the host.
# On AWS these services get no published ports at all (only the gateway
# Collector and SENTINEL talk to them over the internal network).
#
# Memory limits: 768 + 640 + 512 + 128 + 256 + 64 + 128 (prober) = 2496 MiB (budget: 2.5 GB).

services:
  prometheus:
    image: docker.io/prom/prometheus:v3.16.0@sha256:e04987641b57704f408e31f6373ba4138ecf27cb4a165d24aabb6c38fddd0f06
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=4GB
      - --web.enable-otlp-receiver
      - --web.listen-address=:9090
    volumes:
      - promdata:/prometheus
      - ../prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro,Z
      - ../prometheus/rules:/etc/prometheus/rules:ro,Z
    ports: ["127.0.0.1:9090:9090"]
    mem_limit: 768m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    networks: [telemetry]

  alertmanager:
    image: docker.io/prom/alertmanager:v0.35.0@sha256:e638797febd034838eca8b98cdbd46f951e9bf7f178777aa8669167406a9946c
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --data.retention=120h
    volumes:
      - amdata:/alertmanager
      - ../alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro,Z
      # Its API key for SENTINEL (alerts:write), written by the API.
      - alertmanager-key:/etc/alertmanager/secrets:ro
    ports: ["127.0.0.1:9093:9093"]
    # The API must create the key volume (its `:U` owns it). Started first,
    # Alertmanager would create it as `nobody` and the API couldn't write the
    # key (seen on Podman 4.9). Same ordering as the prober's token.
    depends_on: [api]
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9093/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    networks: [telemetry]

  loki:
    image: docker.io/grafana/loki:3.7.10@sha256:b43c257ccfc925d4a50b8717cac61a3b51df8c48d01847936057e5c4075a24a7
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - lokidata:/loki
      - ../loki/loki.yaml:/etc/loki/loki.yaml:ro,Z
    ports: ["127.0.0.1:3100:3100"]
    mem_limit: 640m
    # No container healthcheck: the Loki image has no wget or shell. Readiness is GET /ready.
    restart: unless-stopped
    networks: [telemetry]

  jaeger:
    image: docker.io/jaegertracing/jaeger:2.23.0@sha256:3823829974ccfc2485d2e48b165579091f32295022ae80ca49704e2f4834116e
    command: ["--config", "/etc/jaeger/config.yaml"]
    volumes:
      # :U (Podman) chowns the volume to the image's non-root user, so Jaeger needn't run as root.
      - jaegerdata:/badger:U
      - ../jaeger/config.yaml:/etc/jaeger/config.yaml:ro,Z
    ports:
      - "127.0.0.1:16686:16686" # query API v3 + UI
      - "127.0.0.1:4317:4317"   # OTLP gRPC (direct, dev/tests only)
      - "127.0.0.1:4318:4318"   # OTLP HTTP (direct, dev/tests only)
    mem_limit: 512m
    restart: unless-stopped
    networks: [telemetry]

  # The ingestion gateway: authenticates, normalises, and forwards to the stores.
  gateway:
    image: docker.io/otel/opentelemetry-collector-contrib:0.165.0@sha256:e40d61f10c9a617cca1ffd1be4d7e2b3a4b0f0001798ff07e58cabe82e618cea
    command: ["--config=/etc/otelcol/gateway.yaml"]
    volumes:
      - ../otel/gateway.yaml:/etc/otelcol/gateway.yaml:ro,Z
    mem_limit: 256m
    depends_on: [prometheus, loki, jaeger]
    restart: unless-stopped
    networks: [telemetry] # no published port: only Caddy can reach it

  # External health checks. Its own network has internet egress and Caddy, nothing
  # else; every target also passes the SSRF guard (ADR-0015). In this dev setup
  # it also joins sentinel-ingest, so it can check the demo shop on this machine
  # (allowlisted by exact name below; prod refuses an allowlist).
  prober:
    image: localhost/sentinel-api:dev
    command: ["sentinel", "prober", "run"]
    environment:
      SENTINEL_PROBER_TOKEN_FILE: /run/sentinel-prober/token
      SENTINEL_PROBER_ENDPOINT: http://ingest.sentinel.internal:4319
      SENTINEL_PROBER_ALLOW_HOSTS: ${SENTINEL_PROBER_ALLOW_HOSTS:-aviro_gateway_1,sentinel-probe-target}
      SENTINEL_PROBER_CONFIG_REFRESH_S: ${SENTINEL_PROBER_CONFIG_REFRESH_S:-30}
      SENTINEL_PROBER_HEARTBEAT_S: ${SENTINEL_PROBER_HEARTBEAT_S:-15}
    volumes:
      - prober-token:/run/sentinel-prober:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges]
    mem_limit: 128m
    depends_on: [caddy]
    restart: unless-stopped
    networks: [probe, ingest]

  # The only way in: checks the ingest token, then proxies to the gateway.
  caddy:
    image: docker.io/library/caddy:2.11.9-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
    environment:
      SENTINEL_INTERNAL_AUTH_SECRET: ${SENTINEL_INTERNAL_AUTH_SECRET:-dev-only-internal-auth-secret-change-me-00}
    volumes:
      - ../caddy/Caddyfile:/etc/caddy/Caddyfile:ro,Z
    ports: ["127.0.0.1:4319:4319"]
    mem_limit: 64m
    depends_on: [gateway, api]
    restart: unless-stopped
    networks:
      default: {}
      telemetry: {}
      ingest:
        aliases: [ingest.sentinel.internal]
      probe:
        aliases: [ingest.sentinel.internal]

  # The web UI (Step 13): the built frontend and the API behind one origin.
  # Opt-in (`make ui`), because it needs `frontend/dist` built first.
  web:
    image: docker.io/library/caddy:2.11.9-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
    profiles: [web]
    environment:
      SENTINEL_INTERNAL_AUTH_SECRET: ${SENTINEL_INTERNAL_AUTH_SECRET:-dev-only-internal-auth-secret-change-me-00}
    volumes:
      - ../caddy/web.Caddyfile:/etc/caddy/Caddyfile:ro,Z
      - ../../frontend/dist:/srv:ro,Z
    ports: ["127.0.0.1:3000:8080"] # 8080 is the demo shop's gateway
    mem_limit: 64m
    depends_on: [api]
    restart: unless-stopped

  # Adds the settings the API needs once the gateway and stores are running.
  api:
    environment:
      SENTINEL_PROMETHEUS_URL: http://prometheus:9090
      SENTINEL_LOKI_URL: http://loki:3100
      SENTINEL_JAEGER_URL: http://jaeger:16686
      SENTINEL_INTERNAL_AUTH_SECRET: ${SENTINEL_INTERNAL_AUTH_SECRET:-dev-only-internal-auth-secret-change-me-00}
      SENTINEL_INTEGRATION_FLUSH_INTERVAL_S: ${SENTINEL_INTEGRATION_FLUSH_INTERVAL_S:-30}
      SENTINEL_INTEGRATION_STALE_AFTER_S: ${SENTINEL_INTEGRATION_STALE_AFTER_S:-270}
      SENTINEL_ENTITY_DISCOVERY_INTERVAL_S: ${SENTINEL_ENTITY_DISCOVERY_INTERVAL_S:-60}
      SENTINEL_PROBER_TOKEN_FILE: /run/sentinel-prober/token
      SENTINEL_PROBER_ALLOW_HOSTS: ${SENTINEL_PROBER_ALLOW_HOSTS:-aviro_gateway_1,sentinel-probe-target}
      SENTINEL_HEALTH_CHECK_MIN_INTERVAL_S: ${SENTINEL_HEALTH_CHECK_MIN_INTERVAL_S:-30}
      SENTINEL_PROBE_STATE_INTERVAL_S: ${SENTINEL_PROBE_STATE_INTERVAL_S:-15}
      SENTINEL_ALERTMANAGER_KEY_FILE: /run/sentinel-alertmanager/api-key
      SENTINEL_ALERTMANAGER_URL: http://alertmanager:9093
      SENTINEL_ALERT_RECONCILE_INTERVAL_S: ${SENTINEL_ALERT_RECONCILE_INTERVAL_S:-60}
      SENTINEL_GITHUB_WEBHOOK_SECRET: ${SENTINEL_GITHUB_WEBHOOK_SECRET:-dev-only-github-webhook-secret}
      SENTINEL_GAP_INTERVAL_S: ${SENTINEL_GAP_INTERVAL_S:-30}
      SENTINEL_ERROR_POLL_INTERVAL_S: ${SENTINEL_ERROR_POLL_INTERVAL_S:-30}
      SENTINEL_ERROR_POLL_LAG_S: ${SENTINEL_ERROR_POLL_LAG_S:-20}
      SENTINEL_ERROR_GROUP_QUIET_S: ${SENTINEL_ERROR_GROUP_QUIET_S:-600}
      SENTINEL_CORRELATION_INTERVAL_S: ${SENTINEL_CORRELATION_INTERVAL_S:-15}
      SENTINEL_MITIGATE_AFTER_S: ${SENTINEL_MITIGATE_AFTER_S:-300}
      SENTINEL_LOGIN_RATE_LIMIT_PER_MINUTE: ${SENTINEL_LOGIN_RATE_LIMIT_PER_MINUTE:-5}
      SENTINEL_DEPENDENCY_DISCOVERY_INTERVAL_S: ${SENTINEL_DEPENDENCY_DISCOVERY_INTERVAL_S:-120}
    # Development: serve agent/ from the checkout, so installer edits need no rebuild.
    volumes:
      - ../../agent:/app/agent:ro,Z
      # The API writes the prober's token here; only the prober mounts it (read-only).
      - prober-token:/run/sentinel-prober:U
      # ...and Alertmanager's API key here.
      - alertmanager-key:/run/sentinel-alertmanager:U
    networks: [default, telemetry]

networks:
  default: {}
  telemetry: {}
  # Monitored apps on this machine (AVIRO) join this network to reach Caddy, and nothing else.
  ingest:
    name: sentinel-ingest
  # The prober's own network: internet egress plus Caddy.
  probe:
    name: sentinel-probe

volumes:
  promdata:
  amdata:
  lokidata:
  jaegerdata:
  prober-token:
  alertmanager-key:
