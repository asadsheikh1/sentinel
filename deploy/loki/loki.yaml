# SENTINEL log store: Loki single-binary, filesystem storage, OTLP ingestion
# (POST /otlp/v1/logs). Licence: AGPL-3.0, used unmodified (decision D5).
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn
  # Query results travel querier → frontend over gRPC inside this one process.
  # 4 MB (the default) is less than one page of error lines with full stack
  # traces: the querier failed and the query timed out after 60 s (Step 11).
  grpc_server_max_recv_msg_size: 33554432 # 32 MB
  grpc_server_max_send_msg_size: 33554432

frontend_worker:
  grpc_client_config:
    max_send_msg_size: 33554432

query_scheduler:
  grpc_client_config:
    max_send_msg_size: 33554432

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

schema_config:
  configs:
    - from: "2024-04-01"
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: 168h # 7 days
  allow_structured_metadata: true # OTLP attributes and trace_id are kept as structured metadata
  volume_enabled: true
  ingestion_rate_mb: 8
  ingestion_burst_size_mb: 16
  max_query_series: 5000
  otlp_config:
    resource_attributes:
      # Loki's defaults already index service.name (→ service_name), service.namespace,
      # deployment.environment, host.name, k8s.* and cloud.*. Add SENTINEL's identity.
      attributes_config:
        - action: index_label
          attributes:
            - sentinel.integration.id
            - sentinel.integration.kind
            - deployment.environment.name

compactor:
  working_directory: /loki/compactor
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 2h
  delete_request_store: filesystem

ruler:
  enable_api: false

analytics:
  reporting_enabled: false
