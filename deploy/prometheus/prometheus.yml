# SENTINEL metrics store. Metrics arrive by OTLP push (from the ingestion
# gateway, Step 6), not by scraping; only the stack's own components are scraped.
global:
  scrape_interval: 30s
  evaluation_interval: 30s

# OTLP receiver (enabled by --web.enable-otlp-receiver on the command line).
otlp:
  # Pinned so metric names never change under us between Prometheus versions:
  # "http.server.request.duration" (unit s) -> http_server_request_duration_seconds
  translation_strategy: UnderscoreEscapingWithSuffixes
  # Resource attributes copied onto every series as labels. service.name and
  # service.namespace already become `job`; service.instance.id becomes `instance`.
  promote_resource_attributes:
    - service.name
    - service.namespace
    - service.version
    - deployment.environment
    - deployment.environment.name
    - host.name
    - container.name
    - sentinel.integration.id
    - sentinel.integration.kind

storage:
  tsdb:
    # OTLP pushes can arrive slightly out of order (batching, retries).
    out_of_order_time_window: 30m

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs: [{ targets: ["localhost:9090"] }]
  - job_name: alertmanager
    static_configs: [{ targets: ["alertmanager:9093"] }]
  - job_name: loki
    static_configs: [{ targets: ["loki:3100"] }]
  - job_name: jaeger
    static_configs: [{ targets: ["jaeger:8888"] }]
  - job_name: gateway
    static_configs: [{ targets: ["gateway:8888"] }]
