# RED (Rate, Errors, Duration) recording rules over OpenTelemetry HTTP server
# metrics (stable semantic conventions: http.server.request.duration, seconds).
# Detection rules that use these arrive with the rule packs in Step 10.
groups:
  - name: red
    interval: 30s
    rules:
      - record: service:http_requests:rate5m
        expr: sum by (job, service_name) (rate(http_server_request_duration_seconds_count[5m]))

      - record: service:http_errors:rate5m
        expr: >
          sum by (job, service_name) (
            rate(http_server_request_duration_seconds_count{http_response_status_code=~"5.."}[5m])
          )

      - record: service:http_error_ratio:rate5m
        expr: >
          service:http_errors:rate5m
            / on (job, service_name)
          service:http_requests:rate5m

      - record: service:http_latency_p95_seconds:5m
        expr: >
          histogram_quantile(0.95,
            sum by (job, service_name, le) (rate(http_server_request_duration_seconds_bucket[5m])))

      - record: route:http_requests:rate5m
        expr: >
          sum by (job, service_name, http_route, http_request_method) (
            rate(http_server_request_duration_seconds_count[5m]))
