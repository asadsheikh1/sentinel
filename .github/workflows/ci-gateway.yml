name: ci-gateway

on:
  pull_request:
    paths: &paths
      - "backend/**"
      - "deploy/**"
      - ".github/workflows/ci-gateway.yml"
  push:
    branches: [main]
    paths: *paths

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gateway:
    name: ingestion gateway end to end (rootless Podman)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.8"
          enable-cache: true
      - run: cd backend && uv sync --locked
      - name: Install podman-compose
        run: |
          uv tool install podman-compose==1.6.0
          echo "PODMAN_COMPOSE_PROVIDER=$(command -v podman-compose)" >> "$GITHUB_ENV"
      - name: Validate gateway config
        run: |
          image="$(grep -o 'docker.io/otel/opentelemetry-collector-contrib:[^ ]*' deploy/compose/compose.observability.yaml)"
          podman run --rm -v ./deploy/otel/gateway.yaml:/g.yaml:ro,Z "$image" validate --config=/g.yaml
      - name: Start the full stack
        run: |
          podman --version
          if ! timeout 420 make stack-up-fast; then
            echo "::error::stack did not start within 7 minutes"
            podman ps -a
            for c in postgres migrate api caddy gateway; do
              echo "=== $c"; timeout 10 podman logs --tail 40 "sentinel_${c}_1" || true
            done
            exit 1
          fi
          for i in $(seq 1 90); do
            curl -fsS http://127.0.0.1:8000/readyz >/dev/null && \
            curl -fsS http://127.0.0.1:3100/ready >/dev/null && \
            curl -fsS http://127.0.0.1:9090/-/ready >/dev/null && exit 0
            sleep 2
          done
          podman ps -a; exit 1
      - name: End-to-end tests
        run: make test-gateway
      - name: Logs on failure
        if: failure()
        run: |
          podman ps -a
          for c in caddy gateway api; do echo "=== $c"; podman logs --tail 60 "sentinel_${c}_1" || true; done
          echo "=== alerts in Prometheus"; curl -s http://127.0.0.1:9090/api/v1/alerts || true
          echo; echo "=== alerts in Alertmanager"; curl -s http://127.0.0.1:9093/api/v2/alerts || true
          echo; for c in alertmanager prometheus; do echo "=== $c"; podman logs --tail 40 "sentinel_${c}_1" 2>&1 || true; done
          echo "=== alertmanager key volume"; podman exec sentinel_alertmanager_1 ls -la /etc/alertmanager/secrets/ || true
          echo "=== api: deliveries and warnings"; podman logs sentinel_api_1 2>&1 | grep -E 'ingest/alertmanager|alertmanager_key|"level": "(warning|error)"' | tail -40 || true
