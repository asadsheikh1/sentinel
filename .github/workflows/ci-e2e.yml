name: ci-e2e

on:
  pull_request:
    paths: &paths
      - "frontend/**"
      - "backend/**"
      - "deploy/**"
      - ".github/workflows/ci-e2e.yml"
  push:
    branches: [main]
    paths: *paths

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: browser end to end (incidents, roles, XSS, onboarding)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.8"
          enable-cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd backend && uv sync --locked
      - run: cd frontend && npm ci
      - name: Install podman-compose
        run: |
          uv tool install podman-compose==1.6.0
          echo "PODMAN_COMPOSE_PROVIDER=$(command -v podman-compose)" >> "$GITHUB_ENV"
      - name: Install Chromium for Playwright
        run: cd frontend && npx playwright install --with-deps chromium
      - name: Build the disposable machine for the Linux-host onboarding test
        run: |
          podman build -t localhost/sentinel-test-ubuntu:24.04 \
            -f backend/tests/agent/Containerfile.systemd backend/tests/agent
      - name: Start the stack and the web UI
        run: |
          if ! timeout 420 make stack-up-fast; then
            echo "::error::stack did not start within 7 minutes"
            podman ps -a
            exit 1
          fi
          make ui
          for i in $(seq 1 90); do
            curl -fsS http://127.0.0.1:3000/readyz >/dev/null && \
            curl -fsS http://127.0.0.1:9093/-/ready >/dev/null && exit 0
            sleep 2
          done
          podman ps -a; exit 1
      - name: Browser tests
        env:
          CI: "1"
          # The Linux-host onboarding test installs the agent on that machine, using only
          # what the wizard shows (the installer downloads the agent, as for a user).
          SENTINEL_E2E_AGENT: "1"
        run: make test-e2e
      - name: Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: frontend/test-results
          retention-days: 7
      - name: Logs on failure
        if: failure()
        run: |
          podman ps -a
          for c in web api caddy gateway; do echo "=== $c"; podman logs --tail 80 "sentinel_${c}_1" || true; done
