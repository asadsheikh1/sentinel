[project]
name = "sentinel"
version = "0.1.0"
description = "SENTINEL — Autonomous AI Site Reliability Engineer (local open-weight models, human-approved actions)"
authors = [{ name = "Asad Sheikh" }]
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.32.0",
    "fastapi>=0.163.1",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "pydantic-settings>=2.16.3",
    "pydantic[email]>=2.14.3",
    "sqlalchemy[asyncio]>=2.1.8",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
sentinel = "sentinel.cli:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "hypothesis>=6.170.17",
    "import-linter>=2.16",
    "mypy>=2.4.1",
    "opentelemetry-proto>=1.45.2",
    "psycopg[binary]>=3.3.9",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pytest-cov>=7.1.0",
    "pyyaml>=6.0.3",
    "ruff>=0.17.5",
    "testcontainers>=4.15.0",
    "trustme>=1.2.1",
    "types-pyyaml>=6.0.12.20261113",
]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "SIM", "RUF", "ASYNC", "PT", "N", "C4"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S603", "S607"]  # assert and dummy passwords are fine in tests
"src/sentinel/db/migrations/versions/**" = ["E501", "S608"]  # unwrapped; SQL from constants only

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["sentinel"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["testcontainers.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "-m", "not integration and not db and not observability and not gateway and not agent"]
markers = [
  "integration: needs a container engine (Podman/Docker); run with `make test-integration`",
  "db: needs a real Postgres (Testcontainers); run with `make test-db`",
  "observability: needs the telemetry stores running (`make obs-up`); run with `make test-obs`",
  "gateway: needs the full stack running (`make stack-up-fast`); run with `make test-gateway`",
  "agent: installs the SENTINEL Agent on a test machine (`make test-agent`, needs stack-up-fast)",
]
asyncio_mode = "auto"
# One event loop for the whole session so the session-scoped Postgres fixtures
# (container, engine) can be shared by every async test.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["sentinel"]
branch = true
omit = ["*/sentinel/db/migrations/*"]  # exercised by the db test suite, not unit tests
# SQLAlchemy async runs DB code on greenlets; without this, lines after an await go untraced.
concurrency = ["thread", "greenlet"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85

# ---------------------------------------------------------------- import-linter
# Architectural contracts. More are added as packages appear (see docs/2-architecture/6-security.md).
[tool.importlinter]
root_package = "sentinel"

[[tool.importlinter.contracts]]
name = "Layering: cli -> api -> ingestion -> detection -> incidents -> checks -> integrations -> events -> telemetry -> prober -> auth -> security -> db -> log -> config"
type = "layers"
layers = [
  "sentinel.cli",
  "sentinel.api",
  "sentinel.ingestion",
  "sentinel.detection",
  "sentinel.incidents",
  "sentinel.checks",
  "sentinel.integrations",
  "sentinel.events",
  "sentinel.telemetry",
  "sentinel.prober",
  "sentinel.auth",
  "sentinel.security",
  "sentinel.db",
  "sentinel.log",
  "sentinel.config",
]

# The prober runs in its own container with no database and no API access: its
# code may use only configuration and logging (ADR-0015).
[[tool.importlinter.contracts]]
name = "The prober is isolated: no db, auth, security, telemetry, integrations, checks or api"
type = "forbidden"
source_modules = ["sentinel.prober"]
forbidden_modules = [
  "sentinel.db",
  "sentinel.auth",
  "sentinel.security",
  "sentinel.telemetry",
  "sentinel.integrations",
  "sentinel.checks",
  "sentinel.events",
  "sentinel.detection",
  "sentinel.incidents",
  "sentinel.ingestion",
  "sentinel.api",
]
