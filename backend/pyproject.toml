[project]
name = "sentinel"
version = "0.1.0"
description = "SENTINEL — Autonomous AI Site Reliability Engineer (local open-weight models, human-approved actions)"
authors = [{ name = "Asad Sheikh" }]
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "fastapi>=0.163.1",
    "pydantic-settings>=2.16.3",
    "sqlalchemy[asyncio]>=2.1.8",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
sentinel = "sentinel.cli:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "import-linter>=2.16",
    "mypy>=2.4.1",
    "psycopg[binary]>=3.3.9",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.5",
    "testcontainers>=4.15.0",
]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "SIM", "RUF", "ASYNC", "PT", "N", "C4"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]  # assert and dummy passwords are fine in tests
"src/sentinel/db/migrations/versions/**" = ["E501"]  # migrations read better unwrapped

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["sentinel"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["testcontainers.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "-m", "not integration and not db"]
markers = [
  "integration: needs a container engine (Podman/Docker); run with `make test-integration`",
  "db: needs a real Postgres (Testcontainers); run with `make test-db`",
]
asyncio_mode = "auto"
# One event loop for the whole session so the session-scoped Postgres fixtures
# (container, engine) can be shared by every async test.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["sentinel"]
branch = true
omit = ["*/sentinel/db/migrations/*"]  # exercised by the db test suite, not unit tests

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85

# ---------------------------------------------------------------- import-linter
# Architectural contracts. More are added as packages appear (see docs/2-architecture/6-security.md).
[tool.importlinter]
root_package = "sentinel"

[[tool.importlinter.contracts]]
name = "Layering: cli -> api -> db -> log -> config"
type = "layers"
layers = [
  "sentinel.cli",
  "sentinel.api",
  "sentinel.db",
  "sentinel.log",
  "sentinel.config",
]
